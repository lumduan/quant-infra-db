# pg_hba.conf for quant-postgres (HOME) — TK-0621 interim access restriction, operator ruling 2026-09-29.
# Installed into the live data dir by scripts/apply_pg_hba.sh and applied by a RELOAD (no restart).
# The data dir is not in git, so THIS file is the record. Rules match top to bottom; first match wins.
#
# Who connects, OBSERVED with log_connections through an EOD (not read from configuration):
#   - containers on quant-network             -> their own 172.25.0.x address
#   - HOME host processes via localhost:5432 -> 172.25.0.1 (Docker's proxy; the EOD + crypto EOD DQ reads)
# ⚠️ 172.25.0.1 is also what ANY connection through Docker's userland proxy looks like, including IPv6
#   to the [::]:5432 publish. This file cannot tell those apart; the bind address can (a separate change).
# ⚠️ 172.25.0.0/16 is Docker-assigned. apply_pg_hba.sh refuses to install this file unless quant-network's
#   live subnet is exactly this one: a mismatch would refuse every container.

# TYPE  DATABASE     USER  ADDRESS          METHOD
# Inside the container (docker exec, healthcheck): unchanged from the image default.
local   all          all                    trust
host    all          all   127.0.0.1/32     trust
host    all          all   ::1/128          trust
local   replication  all                    trust
host    replication  all   127.0.0.1/32     trust
host    replication  all   ::1/128          trust

# quant-network: every container, plus HOME host processes arriving via Docker's proxy at 172.25.0.1.
host    all          all   172.25.0.0/16    scram-sha-256

# Everything else is refused before any password is asked: the home LAN, other VLANs, the tunnel.
# The log then reads "pg_hba.conf rejects connection for host ...".
host    all          all   0.0.0.0/0        reject
host    all          all   ::/0             reject
